services:
  postgres:
    image: postgres:16-alpine
    container_name: kudos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kudos
      POSTGRES_PASSWORD: kudos
      POSTGRES_DB: kudos
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username kudos --dbname kudos"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
